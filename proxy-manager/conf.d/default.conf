# Catch-all server for hostnames that don't match any configured proxy host.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/fallback_access.log;
    error_log /var/log/nginx/fallback_error.log warn;

    location / {
        return 404;
    }
}
